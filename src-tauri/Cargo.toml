[package]
name = "lustra"
version = "1.0.0-beta.4"
description = "A focused photo framing desktop app"
authors = ["Lustra"]
edition = "2021"

[lib]
name = "lustra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
documentation-media = ["dep:oxipng", "dep:png"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
crc32fast = "1"
exif = { package = "kamadak-exif", version = "0.6" }
flate2 = "1.1"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
url = "2"
oxipng = { version = "=10.2.1", optional = true }
png = { version = "=0.18.1", optional = true }

[[bin]]
name = "documentation-media-optimize"
path = "src/bin/documentation-media-optimize.rs"
required-features = ["documentation-media"]

[dev-dependencies]
png = "0.18.1"
