[package]
name = "lustra"
version = "0.1.0"
description = "A focused photo framing desktop app"
authors = ["Lustra"]
edition = "2021"

[lib]
name = "lustra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
crc32fast = "1"
exif = { package = "kamadak-exif", version = "0.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
