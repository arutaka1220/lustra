name: Validate release metadata

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release configuration and version mirrors
        run: |
          node -e 'JSON.parse(require("node:fs").readFileSync(".github/release-setup.json", "utf8"))'
          test "$(./scripts/intelirelease read-version .github/release-setup.json)" = "$(node -p "require('./package.json').version")"
      - name: Run release helper tests
        run: node --test scripts/intelirelease.test.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Run app unit tests and build
        run: |
          bun run test
          bun run build
          bun run test:rust

